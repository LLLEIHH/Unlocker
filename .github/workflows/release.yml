name: release

# 推 v* 标签时构建并发布；也可以手动跑一次（workflow_dispatch），只产出 artifact 不发 Release。
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write     # gh release create 需要

jobs:
  single:
    name: 构建单文件版
    runs-on: windows-latest
    env:
      # 沙箱/CI 上常带重复代理变量，会让 MSBuild 直接 MSB6001。
      # 注意：env 名在 GitHub 里**不区分大小写**，不能再写一份 http_proxy / https_proxy
      # —— 会被判成重复定义、整个工作流直接判无效（"failed to parse workflow"）。
      HTTP_PROXY: ''
      HTTPS_PROXY: ''

    steps:
      - uses: actions/checkout@v4

      - name: 环境信息
        shell: pwsh
        run: |
          Write-Host "python: $((python --version) 2>&1)"
          Write-Host "cmake : $((cmake --version) 2>&1 | Select-Object -First 1)"

      # 先常规构建一次：单元测试只有这个目录里才有。
      # 失败时把日志尾部转成 annotation：普通 step 日志需要登录才能下载，annotation 可直接读。
      - name: 常规构建（含测试）
        shell: pwsh
        run: |
          & cmd /c build.cmd 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) {
            Get-Content build.log -Tail 25 | ForEach-Object { Write-Host "::error::$_" }
            exit $LASTEXITCODE
          }

      - name: 单元测试
        shell: pwsh
        run: |
          foreach ($name in @('policy_tests', 'ipc_tests', 'subtree_tests')) {
            $log = "$name.log"
            & cmd /c "build\Release\$name.exe" 2>&1 | Tee-Object -FilePath $log
            if ($LASTEXITCODE -ne 0) {
              Get-Content $log -Tail 20 | ForEach-Object { Write-Host "::error::${name}: $_" }
              exit $LASTEXITCODE
            }
          }

      - name: 构建单文件版（静态 CRT）
        shell: pwsh
        run: |
          & cmd /c build.cmd single 2>&1 | Tee-Object -FilePath single.log
          if ($LASTEXITCODE -ne 0) {
            Get-Content single.log -Tail 25 | ForEach-Object { Write-Host "::error::$_" }
            exit $LASTEXITCODE
          }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item build-single\Release\Unlocker.exe dist\Unlocker-Single.exe

      - name: 冒烟测试（不依赖 VC++ 运行库）
        shell: pwsh
        run: |
          # dumpbin 只在 Developer Command Prompt 的 PATH 里；找不到就跳过，不让检查本身成为阻塞
          if (Get-Command dumpbin.exe -ErrorAction SilentlyContinue) {
            $deps = & dumpbin /dependents dist\Unlocker-Single.exe 2>&1 | Out-String
            if ($deps -match 'vcruntime|msvcp') {
              Write-Host "::error::单文件版仍依赖 VC++ 运行库"
              Write-Host $deps
              exit 1
            }
            Write-Host "依赖检查通过：无 vcruntime / msvcp"
          } else {
            Write-Host "::warning::dumpbin 不在 PATH，跳过依赖检查"
          }

          # GUI 子系统的 exe 用 & 调用不会等待，拿不到退出码；Start-Process -Wait 才可靠
          $p = Start-Process -FilePath "dist\Unlocker-Single.exe" -ArgumentList "--version" `
                             -NoNewWindow -Wait -PassThru
          if ($p.ExitCode -ne 0) {
            Write-Host "::error::--version 退出码 $($p.ExitCode)"
            exit $p.ExitCode
          }

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: unlocker-single
          path: dist/Unlocker-Single.exe
          if-no-files-found: error

      - name: 发布 Release（仅标签触发）
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release create $tag `
            "dist/Unlocker-Single.exe" `
            --title "Unlocker $tag" `
            --generate-notes
