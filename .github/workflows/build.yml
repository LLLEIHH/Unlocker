name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  win32:
    name: Win32 + 单元测试
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: 配置并构建
        shell: pwsh
        # 失败时把日志尾部转成 workflow annotation：错误会直接显示在提交/PR 页面，
        # 也便于用 check-runs annotations API 读取（step 日志本身需要登录才能下载）。
        run: |
          & cmd /c build.cmd 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) {
            "以下为构建日志尾部（共 $(@(Get-Content build.log).Count) 行）" | ForEach-Object { Write-Host "::error::$_" }
            Get-Content build.log -Tail 25 | ForEach-Object { Write-Host "::error::$_" }
            exit $LASTEXITCODE
          }

      - name: 单元测试（黑名单裁决 / 管道协议）
        shell: pwsh
        run: |
          & cmd /c "build\Release\policy_tests.exe" 2>&1 | Tee-Object -FilePath policy.log
          if ($LASTEXITCODE -ne 0) {
            Get-Content policy.log -Tail 20 | ForEach-Object { Write-Host "::error::policy_tests: $_" }
            exit $LASTEXITCODE
          }
          & cmd /c "build\Release\ipc_tests.exe" 2>&1 | Tee-Object -FilePath ipc.log
          if ($LASTEXITCODE -ne 0) {
            Get-Content ipc.log -Tail 20 | ForEach-Object { Write-Host "::error::ipc_tests: $_" }
            exit $LASTEXITCODE
          }

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: unlocker-win32
          # 这里只传 Win32 版与右键扩展。单文件版需要先把 WinUI 编出来（载荷源），
          # 由 release.yml 负责；本工作流不编 WinUI，所以 CMake 会跳过那个目标。
          path: |
            build/Release/Unlocker.exe
            build/Release/UnlockerShell.dll
            build/Release/MakeLock.exe
          if-no-files-found: error
