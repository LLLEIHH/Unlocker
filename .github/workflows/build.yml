name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  win32:
    name: Win32 + 单元测试
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: 配置并构建
        shell: cmd
        run: build.cmd

      - name: 单元测试（黑名单裁决 / 管道协议）
        shell: cmd
        run: |
          build\Release\policy_tests.exe
          if errorlevel 1 exit /b 1
          build\Release\ipc_tests.exe
          if errorlevel 1 exit /b 1

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: unlocker-win32
          # 这里只传 Win32 版与右键扩展。单文件版需要先把 WinUI 编出来（载荷源），
          # 由 release.yml 负责；本工作流不编 WinUI，所以 CMake 会跳过那个目标。
          path: |
            build/Release/Unlocker.exe
            build/Release/UnlockerShell.dll
            build/Release/MakeLock.exe
          if-no-files-found: error
