name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  win32:
    name: Win32 + 单元测试
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: 配置并构建
        shell: pwsh
        # 失败时把日志尾部转成 workflow annotation：错误会直接显示在提交/PR 页面，
        # 也便于用 check-runs annotations API 读取（step 日志本身需要登录才能下载）。
        run: |
          & cmd /c build.cmd 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) {
            "以下为构建日志尾部（共 $(@(Get-Content build.log).Count) 行）" | ForEach-Object { Write-Host "::error::$_" }
            Get-Content build.log -Tail 25 | ForEach-Object { Write-Host "::error::$_" }
            exit $LASTEXITCODE
          }

      - name: 单元测试（黑名单裁决 / 管道协议 / 目录子树）
        shell: pwsh
        run: |
          foreach ($name in @('policy_tests', 'ipc_tests', 'subtree_tests')) {
            $log = "$name.log"
            & cmd /c "build\Release\$name.exe" 2>&1 | Tee-Object -FilePath $log
            if ($LASTEXITCODE -ne 0) {
              Get-Content $log -Tail 20 | ForEach-Object { Write-Host "::error::${name}: $_" }
              exit $LASTEXITCODE
            }
          }

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: unlocker-win32
          # 这里只传常规构建的产物；静态 CRT 的单文件版由 release.yml 用
          # `build.cmd single` 单独产出，不走这个工作流。
          path: |
            build/Release/Unlocker.exe
            build/Release/UnlockerShell.dll
            build/Release/MakeLock.exe
          if-no-files-found: error
